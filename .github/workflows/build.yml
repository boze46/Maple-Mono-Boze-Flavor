name: Build MapleMono-BozeFlavor

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "subframe7536/maple-font 的 ref（分支 / tag / commit SHA）"
        required: false
        default: "v7"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # narrow: 550/1100；slim: 500/1000（与 Sarasa Term SC 一致的 2:1 字距）
        width: [narrow, slim]
    steps:
      - name: Checkout 本仓库（配置）
        uses: actions/checkout@v4

      - name: Checkout 上游 maple-font
        uses: actions/checkout@v4
        with:
          repository: subframe7536/maple-font
          ref: ${{ inputs.upstream_ref }}
          path: maple

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: maple/requirements.txt

      - name: Install dependencies
        run: pip install -r maple/requirements.txt

      - name: 应用 BozeFlavor 配置（hinted 基准）
        env:
          WIDTH: ${{ matrix.width }}
        run: |
          cp config.json maple/config.json
          python - <<'EOF'
          import json, os
          p = "maple/config.json"
          c = json.load(open(p))
          c["width"] = os.environ["WIDTH"]
          json.dump(c, open(p, "w"), indent=2, ensure_ascii=False)
          EOF

      - name: Build hinted（1080p 预设，全量）
        working-directory: maple
        run: python build.py --archive

      - name: 导出 hinted 合并配置
        working-directory: maple
        run: |
          python build.py --dry | sed 's/^font_config: //' > hinted-config.json

      - name: 切换 unhinted 预设（2K）
        run: |
          python - <<'EOF'
          import json
          p = "maple/config.json"
          c = json.load(open(p))
          c["use_hinted"] = False
          c["cn"]["use_hinted"] = False
          json.dump(c, open(p, "w"), indent=2, ensure_ascii=False)
          EOF

      - name: Build unhinted（复用基字缓存，仅重打 NF / NF-CN）
        working-directory: maple
        run: python build.py --archive --cache

      - name: 导出 unhinted 合并配置
        working-directory: maple
        run: |
          python build.py --dry | sed 's/^font_config: //' > unhinted-config.json

      - name: Upload 字体产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fonts-${{ matrix.width }}
          path: maple/fonts/archive/*
          if-no-files-found: warn

      - name: Upload 合并配置
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-${{ matrix.width }}
          path: |
            maple/hinted-config.json
            maple/unhinted-config.json
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find dist/fonts-narrow dist/fonts-slim -type f 2>/dev/null)
          test -n "$files" || { echo "::error::没有找到任何字体产物，请检查 build job 日志"; exit 1; }
          TAG="v$(date +%Y.%m.%d-%H%M%S)"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          dl() {
            name="$1"; label="${2:-下载}"
            if find dist/fonts-narrow dist/fonts-slim -name "$name" -print -quit 2>/dev/null | grep -q .; then
              echo "[📦 ${label}](${BASE}/${name})"
            else
              echo "—"
            fi
          }

          table() {
            p="$1"; desc="$2"
            echo "#### ${p}（${desc}）"
            echo ""
            echo "| 格式 | hinted（≤1080p） | unhinted（≥2K） |"
            echo "| :--- | :---: | :---: |"
            echo "| Variable | — | $(dl "MapleMonoBozeFlavor${p}-Variable.zip") |"
            echo "| TTF | $(dl "MapleMonoBozeFlavor${p}-TTF-AutoHint.zip" "TTF-AutoHint") | $(dl "MapleMonoBozeFlavor${p}-TTF.zip" "TTF") |"
            echo "| OTF | — | $(dl "MapleMonoBozeFlavor${p}-OTF.zip") |"
            echo "| WOFF2 | — | $(dl "MapleMonoBozeFlavor${p}-Woff2.zip") |"
            echo "| NF | $(dl "MapleMonoBozeFlavor${p}-NF.zip") | $(dl "MapleMonoBozeFlavor${p}-NF-unhinted.zip") |"
            echo "| NF-CN | $(dl "MapleMonoBozeFlavor${p}-NF-CN.zip") | $(dl "MapleMonoBozeFlavor${p}-NF-CN-unhinted.zip") |"
            echo ""
          }

          {
            echo "### 下载"
            echo ""
            echo "≤1080p 用 hinted 列，≥2K 用 unhinted 列；Variable / OTF / WOFF2 本身不含 hint，任选。NF / NF-CN 图标全部单宽（mono），hinted 与 unhinted 字体族名相同，同一台机器不要安装同宽度的两套。"
            echo ""
            table NR "narrow：拉丁 550 / 中文 1100"
            table SL "slim：拉丁 500 / 中文 1000，与 Sarasa Term SC 相同的 2:1 字距"
            echo "---"
            echo ""
            echo "### 构建参数"
            echo ""
            echo "- upstream: subframe7536/maple-font@${{ inputs.upstream_ref }}"
            echo "- 四套预设：width（narrow/slim）× hint（hinted=1080p / unhinted=2K），nerd_font.mono=true，未使用 --normal"
            echo ""
            echo "<details>"
            echo "<summary>四套预设的合并配置</summary>"
            for w in narrow slim; do
              for h in hinted unhinted; do
                echo ""
                echo "##### $w / $h"
                echo ""
                echo '```json'
                cat "dist/config-$w/$h-config.json" 2>/dev/null || echo '"(缺失，见 build 日志)"'
                echo '```'
              done
            done
            echo ""
            echo "</details>"
          } > NOTES.md
          echo "$files" | xargs gh release create "$TAG" \
            --latest \
            --title "MapleMono-BozeFlavor $TAG" \
            --notes-file NOTES.md
